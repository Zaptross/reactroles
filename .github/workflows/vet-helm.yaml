name: vet-helm

on:
  push:
    branches:
      - "**"
      - "*/*"
    paths:
      - "helm/**"

permissions:
  contents: read

jobs:
  helm-lint-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./helm/

      - name: Helm template
        run: helm template reactroles ./helm/