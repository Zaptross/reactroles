name: Container Build

on:
  workflow_call:
    inputs:
      registry_image:
        description: "Full registry image name (e.g. ghcr.io/org/repo)"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      build_args:
        description: "Newline-separated build args to pass to docker build"
        required: false
        type: string
        default: ""
      platforms:
        description: "JSON array of platforms to build (e.g. '[\"linux/amd64\", \"linux/arm64\"]')"
        required: false
        type: string
        default: '["linux/amd64"]'
      push:
        description: "Whether to push the built images"
        required: false
        type: boolean
        default: false
      registry_host:
        description: "Registry host (e.g. ghcr.io)"
        required: false
        type: string
        default: "docker.io"
      tags:
        description: "Newline-separated tags to apply (without registry prefix)"
        required: true
        type: string
      push_environment:
        description: "GitHub environment to use for push jobs"
        required: false
        type: string
        default: ""
    secrets:
      registry_username:
        description: "Registry username (if needed)"
        required: false
      registry_token:
        description: "Registry token (if needed)"
        required: false

jobs:
  build:
    environment: ${{ inputs.push_environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_host }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry_image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          build-args: ${{ inputs.build_args }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ inputs.registry_image }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}

      - name: Export digest
        if: ${{ inputs.push }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ inputs.push }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_host }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_token }}

      - name: Build tag args
        id: tags
        run: |
          TAGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAGS="$TAGS -t ${{ inputs.registry_image }}:$tag"
          done <<< "${{ inputs.tags }}"
          echo "tag_args=$TAGS" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.tag_args }} \
            $(printf '${{ inputs.registry_image }}@sha256:%s ' *)